# ============================================================
#  Persistencia: H2 embebida (archivo local, offline-first)
#  Para cambiar de motor basta con sustituir estas 3 propiedades.
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/autopayparking;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Permitir data.sql de inicialización junto al DDL de Hibernate
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Consola web de H2 (opcional, solo diagnóstico)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
#  Aplicación
# ============================================================
logging.level.com.autopay.parking=INFO
spring.main.banner-mode=off
spring.application.name=autopay-parking

# ============================================================
#  Panel de administración web
# ============================================================
server.port=8080
server.address=0.0.0.0
